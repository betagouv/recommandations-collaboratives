{% if user.profile.email_validated %}
    <span class="fr-icon-checkbox-fill fr-text-default--success fr-icon--sm fr-ml-1v" aria-hidden="true" title="Adresse e-mail validée"></span>
{% else %}
    <span class="fr-icon-close-circle-fill fr-text-default--warning fr-icon--sm fr-ml-1v" aria-hidden="true" title="Adresse e-mail non validée"></span>
{% endif %}
