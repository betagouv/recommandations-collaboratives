<!-- component: Grey scale toggle for map
    is_checked: boolean
-->

{% load django_vite %}
{% vite_asset "js/styles/grey-scale-toggle.css.js" %}

<div class="map-filter-toggle">
    <div class="fr-toggle">
        <input type="checkbox"
                class="fr-toggle__input"
                id="toggle_grey"
                {% if is_checked %}checked{% endif %}
                @click="onClickToggleGrey">
        <label class="fr-toggle__label"
                for="toggle_grey">Afficher en niveaux de gris</label>
    </div>
</div>
