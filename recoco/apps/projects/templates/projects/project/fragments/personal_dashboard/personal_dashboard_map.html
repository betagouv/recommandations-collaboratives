{% load static %}
<div x-cloak
     class="fr-p-0 personal-dashboard-map-container"
     :class="{'is-small':mapIsSmall}">
    <template x-if="isBusy">
        <div class="personal-dashboard-map-loader d-flex align-items-center justify-content-center"
             data-cy="loader">
            <div class="spinner-border" role="status">
                <span class="visually-hidden">Chargement…</span>
            </div>
        </div>
    </template>
    <div class="h-100 w-100 personal-dashboard-map" x-ref="map" id="map"></div>
    <div class="map-increase-height-button" x-on:click="handleMapOpen">
        <svg :class="!mapIsSmall ? 'd-none' : 'd-block'"
             class="z-1"
             width="15"
             height="15"
             fill="#000000">
            <use xlink:href="{% static 'svg/bootstrap-icons.svg' %}#arrows-fullscreen" />
        </svg>
        <svg :class="!mapIsSmall ? 'd-block' : 'd-none'"
             class="z-1"
             width="15"
             height="15"
             fill="#000000">
            <use xlink:href="{% static 'svg/bootstrap-icons.svg' %}#fullscreen-exit" />
        </svg>
    </div>
    <div class="map-filter-toggle">
        <div class="fr-toggle">
            <input type="checkbox"
                    class="fr-toggle__input"
                    id="toggle_grey"
                    checked
                    @click="onClickToggleGrey">
            <label class="fr-toggle__label"
                    for="toggle_grey">Afficher en niveaux de gris</label>
        </div>
    </div>
</div>
