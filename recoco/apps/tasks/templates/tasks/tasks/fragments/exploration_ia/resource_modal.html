<div x-show="$store.explorationIA.resourceModal.isOpen"
     class="exploration-ia-modal-overlay"
     @click.self="$store.explorationIA.closeResourceModal()"
     x-transition:enter="transition ease-out duration-200"
     x-transition:enter-start="opacity-0"
     x-transition:enter-end="opacity-100"
     x-transition:leave="transition ease-in duration-150"
     x-transition:leave-start="opacity-100"
     x-transition:leave-end="opacity-0"
     data-test-id="exploration-ia-resource-modal">
    <div class="exploration-ia-modal"
         @click.stop
         role="dialog"
         aria-modal="true"
         aria-labelledby="modal-resource-title">
        <!-- Modal header -->
        <div class="exploration-ia-modal__header">
            <div class="d-flex justify-content-between align-items-start w-100">
                <div class="flex-grow-1 fr-pr-2w">
                    <div class="d-flex align-items-center gap-2 fr-mb-1w">
                        <span class="fr-badge fr-badge--sm"
                              :class="{ 'fr-badge--green-emeraude': $store.explorationIA.resourceModal.citation?.source_type === 'resource', 'fr-badge--purple-glycine': $store.explorationIA.resourceModal.citation?.source_type === 'recommendation' }"
                              x-text="$store.explorationIA.resourceModal.citation?.source_type === 'resource' ? 'Ressource' : 'Recommandation'"></span>
                        <span class="fr-badge fr-badge--sm fr-badge--blue-cumulus"
                              x-show="$store.explorationIA.resourceModal.citation"
                              x-text="'Source ' + ($store.explorationIA.resourceModal.citation?.label || '')"></span>
                    </div>
                    <h2 id="modal-resource-title"
                        class="fr-text--lg fr-mb-0"
                        x-text="$store.explorationIA.resourceModal.resource?.title || $store.explorationIA.resourceModal.citation?.title || 'Détail de la ressource'">
                    </h2>
                </div>
                <button @click="$store.explorationIA.closeResourceModal()"
                        class="fr-btn fr-btn--tertiary-no-outline fr-btn--sm"
                        aria-label="Fermer la modale"
                        data-test-id="exploration-ia-modal-close-btn">
                    <span class="fr-icon-close-line" aria-hidden="true"></span>
                </button>
            </div>
        </div>
        <!-- Modal body -->
        <div class="exploration-ia-modal__body">
            <!-- Loading -->
            <div x-show="$store.explorationIA.resourceModal.isLoading" class="text-center fr-py-4w">
                <div class="spinner-border text-primary" role="status"></div>
                <p class="text-secondary fr-mt-2w">Chargement de la ressource...</p>
            </div>
            <!-- Error -->
            <div x-show="$store.explorationIA.resourceModal.error && !$store.explorationIA.resourceModal.isLoading"
                 class="fr-alert fr-alert--warning">
                <p class="fr-alert__title">Information</p>
                <p x-text="$store.explorationIA.resourceModal.error"></p>
                <template x-if="$store.explorationIA.resourceModal.citation?.reco_id && $store.explorationIA.resourceModal.citation?.project_id">
                    <div class="fr-mt-2w">
                        <p class="fr-text--sm">Vous pouvez consulter la recommandation originale :</p>
                        <a :href="$store.explorationIA.getCitationUrl($store.explorationIA.resourceModal.citation)"
                           class="fr-btn fr-btn--secondary fr-btn--sm fr-mt-1w"
                           target="_blank">
                            <span class="fr-icon-external-link-line fr-mr-1v" aria-hidden="true"></span>
                            Voir la recommandation
                        </a>
                    </div>
                </template>
            </div>
            <!-- Content (resource OR recommendation) -->
            <div x-show="$store.explorationIA.hasModalContent() && !$store.explorationIA.resourceModal.isLoading && !$store.explorationIA.resourceModal.error">
                <!-- CASE 1: RESOURCE content -->
                <template x-if="$store.explorationIA.resourceModal.resource">
                    <div>
                        <div class="exploration-ia-modal__meta fr-mb-3w"
                             x-show="$store.explorationIA.resourceModal.resource?.category || ($store.explorationIA.resourceModal.resource?.tags && $store.explorationIA.resourceModal.resource.tags.length > 0)">
                            <div class="d-flex flex-wrap gap-2 align-items-center">
                                <span class="fr-badge fr-badge--sm fr-badge--blue-cumulus"
                                      x-show="$store.explorationIA.resourceModal.resource?.category?.name"
                                      x-text="$store.explorationIA.resourceModal.resource?.category?.name"></span>
                                <template x-for="(tag, idx) in ($store.explorationIA.resourceModal.resource?.tags || []).slice(0, 5)"
                                          :key="idx">
                                    <span class="fr-badge fr-badge--sm fr-badge--grey" x-text="tag.name || tag"></span>
                                </template>
                                <span x-show="($store.explorationIA.resourceModal.resource?.tags || []).length > 5"
                                      class="fr-badge fr-badge--sm fr-badge--grey"
                                      x-text="'+' + (($store.explorationIA.resourceModal.resource?.tags || []).length - 5)"></span>
                            </div>
                        </div>
                        <div class="exploration-ia-modal__content"
                             x-html="$store.explorationIA.renderMarkdown($store.explorationIA.resourceModal.resource?.content || $store.explorationIA.resourceModal.resource?.text || $store.explorationIA.resourceModal.resource?.summary || '')"></div>
                        <div class="fr-mt-3w" x-show="$store.explorationIA.resourceModal.resource?.url">
                            <a :href="$store.explorationIA.resourceModal.resource?.url"
                               class="fr-link fr-link--sm"
                               target="_blank"
                               rel="noopener noreferrer">
                                <span class="fr-icon-external-link-line fr-mr-1v" aria-hidden="true"></span>
                                Source originale
                            </a>
                        </div>
                    </div>
                </template>
                <!-- CASE 2: RECOMMENDATION content (without resource) -->
                <template x-if="!$store.explorationIA.resourceModal.resource && $store.explorationIA.resourceModal.recommendation">
                    <div>
                        <div class="fr-callout fr-callout--purple-glycine fr-mb-3w">
                            <p class="fr-callout__title fr-text--sm">
                                <span class="fr-icon-info-line fr-mr-1v" aria-hidden="true"></span>
                                Cette recommandation n'a pas de fiche ressource associée
                            </p>
                            <p class="fr-callout__text fr-text--sm">Le contenu ci-dessous est le commentaire initial de la recommandation.</p>
                        </div>
                        <div class="exploration-ia-modal__meta fr-mb-3w"
                             x-show="$store.explorationIA.resourceModal.recommendation?.topic">
                            <div class="d-flex flex-wrap gap-2 align-items-center">
                                <span class="fr-badge fr-badge--sm fr-badge--purple-glycine"
                                      x-show="$store.explorationIA.resourceModal.recommendation?.topic?.name"
                                      x-text="$store.explorationIA.resourceModal.recommendation?.topic?.name"></span>
                            </div>
                        </div>
                        <div class="exploration-ia-modal__content"
                             x-html="$store.explorationIA.renderMarkdown($store.explorationIA.resourceModal.recommendation?.content || $store.explorationIA.resourceModal.recommendation?.comment || $store.explorationIA.resourceModal.recommendation?.intent || '')"></div>
                    </div>
                </template>
            </div>
        </div>
        <!-- Modal footer -->
        <div class="exploration-ia-modal__footer">
            <div class="d-flex justify-content-between align-items-center w-100">
                <a :href="$store.explorationIA.getCitationUrl($store.explorationIA.resourceModal.citation)"
                   class="fr-btn fr-btn--secondary fr-btn--sm"
                   target="_blank"
                   x-show="$store.explorationIA.resourceModal.citation && $store.explorationIA.getCitationUrl($store.explorationIA.resourceModal.citation)"
                   data-test-id="exploration-ia-modal-view-full-btn">
                    <span class="fr-icon-external-link-line fr-mr-1v" aria-hidden="true"></span>
                    Ouvrir la fiche complète
                </a>
                <button @click="$store.explorationIA.closeResourceModal()"
                        class="fr-btn fr-btn--tertiary fr-btn--sm"
                        data-test-id="exploration-ia-modal-close-footer-btn">Fermer</button>
            </div>
        </div>
    </div>
</div>
