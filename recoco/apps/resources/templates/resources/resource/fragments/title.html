{% if resource.title %}
    <h1 class="resource-details__title fr-mb-3v">
        {{ resource.title|capfirst }}
    </h1>
{% endif %}
{% if resource.subtitle %}
    <div class="resource-details__subtitle fr-mb-3v">
        <span>{{ resource.subtitle|capfirst }}</span>
    </div>
{% endif %}
{% if resource.support_orga %}
    <div class="resource-details__organization">
        <span><span class="fr-icon-briefcase-line"></span> Structure porteuse : <span class="fw-700">{{ resource.support_orga|upper }}</span></span>
    </div>
{% endif %}
