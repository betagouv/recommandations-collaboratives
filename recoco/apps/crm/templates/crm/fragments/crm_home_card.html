<!-- component: crm_home_card
    name: string - the name of the card, shown in the top left corner
    text: string - the text content of the card
    icon: string - the icon to display
    link_url: string - the URL the card links to
    anchor: string (optional) - an anchor link for the card
-->
{% load static %}
<a class="position-relative crm-home__card d-flex flex-column" href={{ link_url }}{{ anchor }}>
    <div class="d-flex align-items-center">
        <svg class="crm-home__card--icon bi d-inline fr-mr-1w" width="20" height="20" fill={{ currentColor }} aria-hidden="true">
            <use xlink:href="{% static 'svg/bootstrap-icons.svg' %}#{{ icon }}" />
        </svg>
        <span class="crm-home__card--title d-block text-center font-very-small">{{ name }}</span>
    </div>
    <div>
        <span class="crm-home__card--text">{{ text }}</span>
    </div>
    <span class="crm-home__card--arrow position-absolute fr-icon-right-arrow" aria-hidden="true"></span>
</a>
