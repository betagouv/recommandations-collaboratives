{% load django_vite %}
{% block js %}
    {% vite_asset 'js/styles/projects-searchbar.css.js' %}
{% endblock js %}
<div class="flex-grow-1">
    <form method="get"
          action="{% url 'crm-search' %}"
          class="d-flex align-items-center justify-content-end">
        <div class="d-flex align-items-center position-relative {{ width_class|default:"w-75" }}">
            <input type="search"
                   name="query"
                   placeholder="Rechercher dans l'admin"
                   value="{{ init_value|default:'' }}"
                   class="{{ padding_icon_class |default:"fr-pl-4w" }} w-100 bg-white searchbar-input {{ padding_class |default:"" }}">
            <span class="fr-icon-search-line correct-position" aria-hidden="true"></span>
        </div>
    </form>
</div>
