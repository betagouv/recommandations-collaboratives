verified_commit: 0d538ef9ce027143390ebd6d04e3d13a6fc6e2b6
# ^ the git commit this whole matrix's code_ref/tests entries were last
# checked against. Used by scripts/check_permissions_matrix.py to detect
# when a referenced view or test has changed since and needs re-review.
# Individual viewsets/actions/endpoints may override with their own
# `verified_commit` field if they were re-checked more recently than the
# rest of the file.

# Reference matrix of REST API permissions.
#
# History:
#   - First pass: transcribed as-is from the source document "permissions
#     api.md" (Téléchargements), with reviewed/deprecated flags from the
#     source's ☑ / strikethrough markers.
#   - Second pass (this version): each viewset's actual permission_classes /
#     get_permissions() / get_queryset() logic was located in the codebase
#     (code_ref, file:line) and matching tests were identified (tests: list
#     of file:function or file:line). `verified` records whether the actual
#     code matches what the source doc claimed, and `discrepancy` explains
#     any mismatch or gap found.
#
# Fields:
#   name       - viewset dotted path (module.ClassName)
#   reviewed   - true if the source doc marked this viewset with a checkmark (☑)
#   deprecated - true if the source doc struck through the viewset name (~~...~~)
#                NOTE: for TaskFollowupViewSet this flag is now known to be
#                WRONG — the viewset is live, in active use, and tested. See
#                its discrepancy note.
#   note       - free-form remark from the source doc's "/!\" column (viewset level)
#   code_ref   - file:line of the viewset class itself
#   actions    - list of per verb/route entries:
#       verb          - HTTP verb or route/action name, as given in the source doc
#       permission    - permission expression as written in the source doc
#       roles         - roles allowed, as written in the source doc
#       note          - free-form remark from the source doc (action level)
#       code_ref      - file:line of the actual permission check for this action
#       verified      - true/false/partial — does code match the source doc's claim
#       discrepancy   - explanation when verified is false/partial, or a gap found
#       tests         - list of "path/to/test_file.py:function_name" (or :line)
#                       exercising this permission

# ---------------------------------------------------------------------------
# Ground-truth role -> permission mapping, derived from code (not from the
# source doc). Used to check the `roles` field of each action below via
# `roles_check`. Two distinct mechanisms exist:
#   - site:*    persistent, per-tenant (Site) Django Group, statically
#               composing permissions (SITE_GROUP_PERMISSIONS)
#   - project:* NOT a Group — a runtime, per-object grant assigned directly
#               to the user via guardian's assign_perm(perm, user, project)
#               when they become a collaborator/advisor/observer on that
#               specific project
roles:
  "site:staff":
    mechanism: "Django Group, per-Site, static membership (SITE_GROUP_PERMISSIONS)"
    code_ref: "recoco/apps/home/models.py:42-50"
    permissions:
      - sites.moderate_projects
      - sites.list_projects
      - sites.delete_projects
      - sites.manage_resources
      - sites.use_crm
      - sites.use_addressbook
      - sites.change_addressbook

  "site:admin":
    mechanism: "Django Group, per-Site, static membership (SITE_GROUP_PERMISSIONS)"
    code_ref: "recoco/apps/home/models.py:51-54"
    permissions:
      - sites.manage_surveys
      - sites.manage_configuration

  "site:advisor":
    mechanism: "Django Group, per-Site, static membership (SITE_GROUP_PERMISSIONS)"
    code_ref: "recoco/apps/home/models.py:55-60"
    permissions:
      - sites.list_projects
      - sites.use_addressbook
      - sites.change_addressbook
      - sites.manage_resources

  "project:member_draft":
    mechanism: "Runtime per-object grant to user (not a Group), via assign_collaborator_permissions before project moderation"
    code_ref: "recoco/apps/projects/models.py:52-60"
    permissions:
      - projects.view_public_notes
      - projects.use_public_notes
      - projects.view_project
      - projects.view_tasks
      - projects.use_surveys
      - projects.view_surveys
      - projects.change_location

  "project:member":
    mechanism: "Runtime per-object grant to user (not a Group), via assign_collaborator_permissions once project is accepted; superset of project:member_draft"
    code_ref: "recoco/apps/projects/models.py:52-67"
    permissions:
      - projects.view_public_notes
      - projects.use_public_notes
      - projects.view_project
      - projects.view_tasks
      - projects.use_surveys
      - projects.view_surveys
      - projects.change_location
      - projects.use_tasks
      - projects.manage_documents
      - projects.invite_collaborators
      - projects.manage_collaborators

  "project:advisor":
    mechanism: "Runtime per-object grant to user (not a Group), via assign_advisor / ProjectSwitchtender(is_observer=False)"
    code_ref: "recoco/apps/projects/models.py:69-89"
    permissions: &project_advisor_perms
      - projects.view_public_notes
      - projects.use_advisor_note
      - projects.use_public_notes
      - projects.use_private_notes
      - projects.view_project
      - projects.view_tasks
      - projects.manage_tasks
      - projects.use_tasks
      - projects.invite_advisors
      - projects.invite_collaborators
      - projects.manage_collaborators
      - projects.change_topics
      - projects.manage_documents
      - projects.use_surveys
      - projects.view_surveys
      - projects.change_project
      - projects.change_location
      - projects.use_project_tags
      - projects.manage_private_documents

  "project:observer":
    mechanism: "Runtime per-object grant to user (not a Group), via assign_observer / ProjectSwitchtender(is_observer=True)"
    code_ref: "recoco/apps/projects/models.py:91"
    note: >
      IDENTICAL permission set to project:advisor — OBSERVER_PERMISSIONS is a
      direct alias of ADVISOR_PERMISSIONS in code, no restriction is applied
      despite the "observer" name implying read-only/limited access. See
      finding in the "roles vs code" discrepancies below.
    permissions: *project_advisor_perms

