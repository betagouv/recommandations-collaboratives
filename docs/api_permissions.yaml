# Extensibility blind spot: recoco/rest_api/urls.py:199-213
# _collect_plugin_rest_urls() dynamically imports `rest_urls_module` from any
# installed plugin that declares one, and appends its urlpatterns. As of this
# pass, no plugin in the codebase declares rest_urls_module, so nothing is
# hidden today -- but this mechanism means a future plugin's REST endpoints
# will NOT show up in a static read of urls.py, and must be checked
# separately (per-plugin) when auditing permissions again.
