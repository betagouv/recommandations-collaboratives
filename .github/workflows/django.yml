name: main.yml

on:
  push:
    branches: ['main', 'develop', 'release/*', 'feature/*']
  pull_request:
    branches: ['main', 'develop', 'release/*']

jobs:
  front:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Compile JS
        working-directory: ./recoco/frontend
        run: |
          yarn install
          yarn build

  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version-file: "pyproject.toml"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Setup Pre-commit
        uses: pre-commit/action@v3.0.1

      - name: Run Pre-commit checks
        uses: pre-commit-ci/lite-action@v1.1.0
        if: always()

  django-tests:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write # post coverage comments on PRs
      contents: write      # push to python-coverage-comment-action-data branch
      actions: read        # read baseline coverage artifact from main branch runs

    services:
      # Label used to access the service container
      postgres:
        # Docker Hub image
        image: postgres:16
        # Provide the password for postgres
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: uv_ci
        # Set health checks to wait until postgres has started
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          # Maps tcp port 5432 on service container to the host
          - 5432:5432

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4.1.5
        with:
          persist-credentials: true

      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install python3-gdal pandoc python3-dev libpq-dev libxml2-dev libxslt1-dev libheif-dev

      - name: Install uv and python
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install Dependencies
        run: |
          uv sync

      - name: Configure
        run: |
          cp recoco/settings/development.py.example recoco/settings/development.py

      - name: Audit dependencies
        run: uv audit

      - name: Run Tests
        env:
          SECRET_KEY: 'this-is-not-a-secret-key'
          SENDINBLUE_API_KEY: 'this-is-a-fake-api-key'
          DJANGO_DB_HOST: localhost
          DJANGO_DB_USER: postgres
          DJANGO_DB_PASSWORD: postgres
          DJANGO_DB_NAME: uv_ci
          DJANGO_DB_PORT: 5432
          DJANGO_DB_ENGINE: django.db.backends.postgresql
        run: |
          uv run pytest --create-db -q --cov-report=term-missing

      - name: Coverage comment
        id: coverage_comment
        uses: py-cov-action/python-coverage-comment-action@v3
        with:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Store Pull Request comment to be posted
        uses: actions/upload-artifact@v4
        if: steps.coverage_comment.outputs.COMMENT_FILE_WRITTEN == 'true'
        with:
          # If you use a different name, update COMMENT_ARTIFACT_NAME accordingly
          name: python-coverage-comment-action
          # If you use a different name, update COMMENT_FILENAME accordingly
          path: python-coverage-comment-action.txt
